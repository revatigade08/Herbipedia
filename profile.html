<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile - Herbipedia</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <span class="logo">
    <i class="fas fa-leaf"></i>
    <span class="brand-name">Herbi<span class="highlight">pedia</span></span>
  </span>

  <nav>
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="ayush.html"><i class="fas fa-cube"></i> 3D Plants</a>
    <a href="about.html"><i class="fas fa-users"></i> About</a>
    <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </nav>
</header>


<section style="margin-top:120px;">
  <div class="container">
    <div class="content">

      <div class="text" style="width:100%;">

        <h2>My Profile 🌿</h2>

        <p><strong>Name:</strong> <span id="profileName">Loading...</span></p>
        <p><strong>Username:</strong> <span id="profileUsername"></span></p>
        <p><strong>Email:</strong> <span id="profileEmail"></span></p>
        <p><strong>Contact:</strong> <span id="profileContact"></span></p>
        <p><strong>Gender:</strong> <span id="profileGender"></span></p>
        <p><strong>DOB:</strong> <span id="profileDob"></span></p>

      </div>

    </div>
  </div>
</section>


<script type="module">

import { auth, db } from "./js/firebase-config.js";
import { onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { doc, getDoc }
  from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const logoutBtn = document.getElementById("logoutBtn");

const profileName = document.getElementById("profileName");
const profileUsername = document.getElementById("profileUsername");
const profileEmail = document.getElementById("profileEmail");
const profileContact = document.getElementById("profileContact");
const profileGender = document.getElementById("profileGender");
const profileDob = document.getElementById("profileDob");

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const docRef = doc(db, "users", user.uid);
  const docSnap = await getDoc(docRef);

  if (docSnap.exists()) {
    const data = docSnap.data();

    profileName.textContent = data.name;
    profileUsername.textContent = data.username;
    profileEmail.textContent = data.email;
    profileContact.textContent = data.contact;
    profileGender.textContent = data.gender;
    profileDob.textContent = data.dob;
  }

});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});

</script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
