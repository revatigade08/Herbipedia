<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Herbipedia - Profile</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>

<div class="profile-container">

  <div class="profile-card">
    <div class="avatar-section">
      <div class="avatar" id="profileAvatar"></div>
      <input type="file" id="profileImageInput" hidden>
      <button id="uploadImageBtn">Change Photo</button>
    </div>

    <h2 id="profileName"></h2>
    <p class="username" id="profileUsername"></p>

    <div class="info">
      <p><strong>Email:</strong> <span id="profileEmail"></span></p>
      <p><strong>DOB:</strong> <span id="profileDob"></span></p>
      <p><strong>Contact:</strong> <span id="profileContact"></span></p>
      <p><strong>Gender:</strong> <span id="profileGender"></span></p>
      <p><strong>Member Since:</strong> <span id="profileCreated"></span></p>
    </div>

    <button id="editProfileBtn">Edit Profile</button>
    <button id="logoutBtn" class="logout">Logout</button>
  </div>

  <div class="bookmark-section">
    <h3>Bookmarks (<span id="bookmarkCount">0</span>)</h3>
    <div id="bookmarkList"></div>
  </div>

</div>

<script type="module" src="profile.js"></script>
</body>
</html>
