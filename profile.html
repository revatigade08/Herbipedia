<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile - Herbipedia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/profile.css">
</head>

<body>

<header>
  <span class="logo">
    🌿 Herbi<span style="color:#6bbf59;">pedia</span>
  </span>
</header>

<div class="profile-wrapper">

  <!-- LEFT PROFILE CARD -->
  <div class="profile-card">
    <div class="avatar" id="avatar">U</div>
    <h2 id="userName">Loading...</h2>
    <p id="userEmail"></p>

    <button class="edit-btn" id="editProfile">
      Edit Profile
    </button>
  </div>

  <!-- RIGHT DASHBOARD -->
  <div class="dashboard-section">

    <h3>Personal Information</h3>

    <div class="info-grid">
      <div class="info-box">Username: <span id="username"></span></div>
      <div class="info-box">Contact: <span id="contact"></span></div>
      <div class="info-box">DOB: <span id="dob"></span></div>
      <div class="info-box">Gender: <span id="gender"></span></div>
      <div class="info-box">Member Since: <span id="createdAt"></span></div>
    </div>

    <h3>Bookmarked Plants 🌿</h3>
    <div class="bookmark-grid" id="bookmarkGrid"></div>

  </div>
</div>

<script type="module" src="js/profile.js"></script>
</body>
</html>
