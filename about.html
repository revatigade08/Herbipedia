<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us - Herbipedia</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    :root {
      --main-green: #3a6b4b;
      --accent-green: #6bbf59;
      --background: #f9faf8;
      --white: #fff;
      --text-dark: #25362b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #f9faf8 0%, #e0f2ee 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ================= HEADER ================= */

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: linear-gradient(to right, #fff, #e0f7e9);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .logo i {
      color: #4CAF50;
      transition: transform 0.3s;
    }

    .logo:hover i {
      transform: rotate(-15deg) scale(1.2);
    }

    .brand-name {
      color: #2E7D32;
    }

    .brand-name .highlight {
      color: #66BB6A;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    nav a i {
      margin-right: 6px;
      color: #4CAF50;
    }

    nav a:hover {
      background: #e8f5e9;
      color: var(--main-green);
    }

    /* ================= MOBILE ================= */

    .menu-toggle {
      display: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--main-green);
      background: none;
      border: none;
    }

    @media (max-width: 768px) {
      .menu-toggle {
        display: block;
      }

      nav {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 70px;
        right: 20px;
        background: white;
        box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        border-radius: 12px;
        padding: 1rem 2rem;
      }

      nav.show {
        display: flex;
      }

      nav a {
        padding: 0.8rem 0;
        width: 100%;
        border-bottom: 1px solid #e0f2ee;
      }

      nav a:last-child {
        border-bottom: none;
      }
    }

    /* ================= MAIN ================= */

    main {
      max-width: 900px;
      margin: 4rem auto;
      padding: 3rem;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      flex: 1;
    }

    .about-container h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--main-green);
    }

    .about-container p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #455a4f;
    }
  </style>
</head>

<body>

<header>
  <span class="logo">
    <i class="fas fa-leaf"></i>
    <span class="brand-name">
      Herbi<span class="highlight">pedia</span>
    </span>
  </span>

  <button class="menu-toggle" id="menu-toggle">&#9776;</button>

  <nav id="navbar">
    <a href="index.html" id="navHome">
      <i class="fas fa-home"></i> Home
    </a>

    <a href="ayush.html" id="nav3D">
      <i class="fas fa-cube"></i> 3D Plants
    </a>

    <a href="about.html" id="navAbout">
      <i class="fas fa-users"></i> About Us
    </a>

    <a href="contact.html" id="navContact">
      <i class="fas fa-envelope"></i> Contact Us
    </a>

    <a href="login.html" id="navLogin">
      <i class="fas fa-sign-in-alt"></i> Login
    </a>

    <a href="register.html" id="navRegister">
      <i class="fas fa-user-plus"></i> Register
    </a>

    <a href="#" id="navLogout" style="display:none;">
      <i class="fas fa-sign-out-alt"></i> Logout
    </a>
  </nav>
</header>

<main>
  <div class="about-container">
    <h2>Who We Are</h2>
    <p>
      Welcome to Herbipedia — a creative blend of botanical knowledge and digital innovation.
      Our platform bridges traditional plant wisdom with immersive technology,
      making learning interactive, engaging, and modern.
    </p>
  </div>
</main>

<!-- Mobile Toggle Script -->
<script>
  const toggle = document.getElementById("menu-toggle");
  const nav = document.getElementById("navbar");

  toggle.addEventListener("click", () => {
    nav.classList.toggle("show");
  });
</script>

<!-- Firebase Auth Guard -->
<script type="module" src="js/auth-guard.js"></script>

</body>
</html>
